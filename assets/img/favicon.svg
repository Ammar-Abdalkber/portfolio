<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="600" height="600" role="img" aria-label="Analytics dashboard monitor with pie and bar charts" xmlns:c2pa="http://c2pa.org/manifest"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="15" y1="290" x2="285" y2="10">
      <stop offset="0" stop-color="#F9591B"></stop>
      <stop offset="0.55" stop-color="#FDA02A"></stop>
      <stop offset="1" stop-color="#FFD83A"></stop>
    </linearGradient>
    <linearGradient id="gFill" gradientUnits="userSpaceOnUse" x1="15" y1="290" x2="285" y2="10">
      <stop offset="0" stop-color="#F9591B" stop-opacity=".28"></stop>
      <stop offset="1" stop-color="#FFD83A" stop-opacity=".28"></stop>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB22E" stop-opacity=".28"></stop>
      <stop offset="1" stop-color="#FFB22E" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <!-- cut-outs so the pie and slice sit cleanly over the monitor frame -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300">
      <rect width="300" height="300" fill="#fff"></rect>
      <circle cx="105" cy="100" r="66" fill="#000"></circle>
      <path d="M130,70 L130,0 L200,0 L200,70 Z" fill="#000"></path>
    </mask>
  </defs><style>
    .s { fill: none; stroke: url(#g); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s cubic-bezier(.65,0,.35,1) forwards; }
    .d2 { animation-delay: .25s } .d3 { animation-delay: .5s } .d4 { animation-delay: .75s }
    .bar { fill: url(#gFill); transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0);
           animation: grow .9s cubic-bezier(.34,1.56,.64,1) forwards; }
    .b1 { animation-delay: 1.1s } .b2 { animation-delay: 1.25s } .b3 { animation-delay: 1.4s }
    .slice { transform-box: fill-box; transform-origin: 0% 100%; animation: float 3.6s ease-in-out 2s infinite; }
    .pie { transform-box: fill-box; transform-origin: 50% 50%; animation: breathe 4s ease-in-out 2s infinite; }
    .halo { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .dash { animation: blink 1.6s ease-in-out 2s infinite; }
    .dash:nth-child(2) { animation-delay: 2.2s } .dash:nth-child(3) { animation-delay: 2.4s }
    .spark { fill: #FFE27A; opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
    .sp2 { animation-delay: 1s } .sp3 { animation-delay: 2s }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes grow { to { transform: scaleY(1) } }
    @keyframes float { 0%,100% { transform: translate(0,0) rotate(0) } 50% { transform: translate(4px,-6px) rotate(5deg) } }
    @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.03) } }
    @keyframes pulse { 0%,100% { opacity: .6; transform: scale(1) } 50% { opacity: 1; transform: scale(1.08) } }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.3) } 50% { opacity: 1; transform: scale(1) } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important }
      .draw { stroke-dashoffset: 0 } .bar { transform: none } .spark { opacity: 0 }
    }
  </style><ellipse class="halo" cx="150" cy="150" rx="150" ry="140" fill="url(#halo)"></ellipse><g filter="url(#glow)">
    <!-- monitor -->
    <g mask="url(#cut)">
      <rect class="s draw" pathLength="1" x="15" y="45" width="265" height="198" rx="22"></rect>
      <rect class="s draw d2" pathLength="1" x="36" y="66" width="223" height="156" rx="4"></rect>
    </g>
    <!-- stand -->
    <path class="s draw d2" pathLength="1" d="M122 245 V262 M172 245 V262"></path>
    <rect class="s draw d3" pathLength="1" x="98" y="262" width="98" height="26" rx="9"></rect>

    <!-- text lines -->
    <path class="s draw d3" pathLength="1" d="M52 160 H92 M52 182 H92"></path>

    <!-- status dashes -->
    <g>
      <rect class="dash" x="196" y="219" width="14" height="8" rx="1.5" fill="url(#g)"></rect>
      <rect class="dash" x="219" y="219" width="14" height="8" rx="1.5" fill="url(#g)"></rect>
      <rect class="dash" x="242" y="219" width="14" height="8" rx="1.5" fill="url(#g)"></rect>
    </g>

    <!-- bar chart -->
    <path class="s draw d4" pathLength="1" d="M158 186 H288"></path>
    <rect class="s bar b1" x="175" y="146" width="18" height="40" rx="2"></rect>
    <rect class="s bar b2" x="210" y="122" width="18" height="64" rx="2"></rect>
    <rect class="s bar b3" x="245" y="98" width="18" height="88" rx="2"></rect>

    <!-- pie chart -->
    <g class="pie">
      <path class="s draw d2" pathLength="1" d="M105 50 A50 50 0 1 0 155 100 L105 100 Z"></path>
    </g>
    <!-- floating slice -->
    <g class="slice">
      <path class="s draw d3" pathLength="1" d="M130 70 V13 A57 57 0 0 1 187 70 Z"></path>
    </g>
  </g><path class="spark" d="M265 55 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"></path><path class="spark sp2" d="M30 30 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"></path><path class="spark sp3" d="M222 140 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"></path></svg>